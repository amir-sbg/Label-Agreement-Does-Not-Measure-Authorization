<svg xmlns="http://www.w3.org/2000/svg" width="116" height="20" role="img" aria-label="AIM Workshop">
  <title>AIM Workshop</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="116" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="39" height="20" fill="#555"/>
    <rect x="39" width="77" height="20" fill="#e9a23b"/>
    <rect width="116" height="20" fill="url(#s)"/>
  </g>
  <g font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="11" text-anchor="middle">
    <text x="20" y="15" fill="#010101" fill-opacity=".3">AIM</text>
    <text x="20" y="14" fill="#fff">AIM</text>
    <text x="77" y="15" fill="#010101" fill-opacity=".3">Workshop</text>
    <text x="77" y="14" fill="#09111d">Workshop</text>
  </g>
</svg>
