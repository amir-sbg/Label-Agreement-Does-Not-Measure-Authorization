[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-harmonization"
version = "1.0.0"
description = "Label agreement does not measure authorization: an audit of agentic metadata harmonization on COBRE and FBIRN"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.14",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "xlrd>=2.0",
]

[project.optional-dependencies]
agent = ["torch>=2.4", "transformers>=5.0", "accelerate>=1.0"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
